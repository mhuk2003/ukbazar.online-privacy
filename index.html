<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — UK BAZAR</title>
<link rel="icon" href="./logo-ukbazar.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #667eea;
  --primary-dark: #4c5fd5;
  --accent: #fbbf24;
  --navy: #0f1f3d;
  --navy2: #1a3a6b;
  --bg: #f0f4ff;
  --card: #ffffff;
  --txt: #1e293b;
  --muted: #64748b;
  --border: #e2e8f5;
  --green: #059669;
  --radius: 18px;
  --sh: 0 4px 24px rgba(102,126,234,0.10);
  --sh2: 0 12px 40px rgba(102,126,234,0.18);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans Arabic', sans-serif;
  background: var(--bg);
  color: var(--txt);
  direction: rtl;
  line-height: 1.7;
  font-size: 15px;
  overflow-x: hidden;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--navy);
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 2px 20px rgba(0,0,0,0.25);
}
.topbar-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.tb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  cursor: pointer;
}
.tb-brand img {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  object-fit: contain;
  background: white;
  padding: 2px;
}
.tb-brand span {
  font-family: 'Outfit', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
}
.tb-back {
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.85);
  border: 1px solid rgba(255,255,255,0.2);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
  font-family: inherit;
}
.tb-back:hover { background: rgba(255,255,255,0.2); color: #fff; }

/* ── HERO ── */
.hero {
  background: linear-gradient(145deg, var(--navy) 0%, var(--navy2) 55%, #2050a0 100%);
  padding: 56px 20px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 15% 30%, rgba(102,126,234,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 85% 70%, rgba(251,191,36,0.10) 0%, transparent 55%);
  pointer-events: none;
}
/* floating dots */
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle 1.5px at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 100%),
    radial-gradient(circle 1px at 70% 40%, rgba(255,255,255,0.10) 0%, transparent 100%),
    radial-gradient(circle 2px at 45% 75%, rgba(255,255,255,0.08) 0%, transparent 100%),
    radial-gradient(circle 1px at 90% 15%, rgba(255,255,255,0.12) 0%, transparent 100%);
  pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(251,191,36,0.18);
  color: var(--accent);
  border: 1px solid rgba(251,191,36,0.35);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  margin-bottom: 18px;
  letter-spacing: 0.5px;
}
.hero h1 {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  font-weight: 800;
  color: #fff;
  margin-bottom: 12px;
  line-height: 1.2;
}
.hero h1 span {
  background: linear-gradient(90deg, var(--accent), #fde68a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  color: rgba(255,255,255,0.60);
  font-size: 0.88rem;
  max-width: 440px;
  margin: 0 auto 22px;
}
.hero-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: rgba(255,255,255,0.45);
  font-size: 0.75rem;
}
.hero-meta i { color: var(--accent); }

/* ── TOC CARD ── */
.toc-wrap {
  max-width: 900px;
  margin: -28px auto 0;
  padding: 0 20px;
  position: relative;
  z-index: 10;
}
.toc-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 22px 26px;
  box-shadow: var(--sh2);
  border: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}
.toc-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--navy2);
  font-size: 0.8rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.toc-item:hover {
  background: #eef2ff;
  border-color: #c7d2fe;
  color: var(--primary);
  transform: translateX(-3px);
}
.toc-item .ti-num {
  width: 22px; height: 22px;
  background: linear-gradient(135deg, var(--primary), #764ba2);
  color: #fff;
  border-radius: 6px;
  font-size: 0.68rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: 'Outfit', sans-serif;
}

/* ── MAIN CONTENT ── */
.content {
  max-width: 900px;
  margin: 32px auto 48px;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Summary cards */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px;
  margin-bottom: 6px;
}
.sum-card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px 14px;
  border: 1px solid var(--border);
  box-shadow: var(--sh);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.sum-card:hover { transform: translateY(-3px); box-shadow: var(--sh2); }
.sum-ico {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.si-blue { background: #eff6ff; }
.si-green { background: #ecfdf5; }
.si-yellow { background: #fffbeb; }
.si-red { background: #fef2f2; }
.si-purple { background: #f5f3ff; }
.si-teal { background: #ecfeff; }
.sum-body {}
.sum-title { font-size: 0.78rem; font-weight: 800; color: var(--navy); margin-bottom: 2px; }
.sum-text  { font-size: 0.72rem; color: var(--muted); line-height: 1.5; }

/* Section cards */
.sec-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--sh);
  overflow: hidden;
  animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.sec-card:nth-child(2) { animation-delay: 0.05s; }
.sec-card:nth-child(3) { animation-delay: 0.10s; }
.sec-card:nth-child(4) { animation-delay: 0.15s; }
.sec-card:nth-child(5) { animation-delay: 0.20s; }
.sec-card:nth-child(6) { animation-delay: 0.25s; }
.sec-card:nth-child(7) { animation-delay: 0.30s; }
.sec-card:nth-child(8) { animation-delay: 0.35s; }

.sec-hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 22px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, #f8faff 0%, #fff 100%);
}
.sec-num {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--primary), #764ba2);
  color: #fff;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
  font-family: 'Outfit', sans-serif;
}
.sec-title {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--navy);
}
.sec-icon {
  margin-right: auto;
  color: var(--primary);
  font-size: 1rem;
  opacity: 0.7;
}
.sec-body {
  padding: 18px 22px 20px;
}
.sec-body p {
  font-size: 0.87rem;
  color: #374151;
  line-height: 1.8;
  margin-bottom: 10px;
}
.sec-body p:last-child { margin-bottom: 0; }
.sec-body ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.sec-body ul li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 0.86rem;
  color: #374151;
  line-height: 1.65;
  padding: 9px 12px;
  background: var(--bg);
  border-radius: 9px;
  border: 1px solid var(--border);
}
.sec-body ul li::before {
  content: '✓';
  color: var(--green);
  font-weight: 800;
  font-size: 0.78rem;
  flex-shrink: 0;
  margin-top: 2px;
  background: #ecfdf5;
  width: 18px; height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.highlight-box {
  background: linear-gradient(135deg, #eef2ff, #f5f3ff);
  border: 1px solid #c7d2fe;
  border-right: 4px solid var(--primary);
  border-radius: 10px;
  padding: 13px 16px;
  margin-top: 12px;
  font-size: 0.83rem;
  color: var(--navy2);
  font-weight: 600;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.highlight-box i { color: var(--primary); margin-top: 2px; flex-shrink: 0; }

/* Contact section */
.contact-card {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #2050a0 100%);
  border-radius: var(--radius);
  padding: 28px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(15,31,61,0.30);
}
.contact-card::before {
  content: '';
  position: absolute;
  right: -60px; top: -60px;
  width: 200px; height: 200px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
}
.contact-card::after {
  content: '';
  position: absolute;
  left: -40px; bottom: -40px;
  width: 160px; height: 160px;
  background: rgba(251,191,36,0.05);
  border-radius: 50%;
}
.contact-card > * { position: relative; z-index: 1; }
.contact-card h3 {
  font-family: 'Outfit', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  color: #fff;
  margin-bottom: 7px;
}
.contact-card p { color: rgba(255,255,255,0.55); font-size: 0.82rem; margin-bottom: 18px; }
.contact-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.cbtn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 0.83rem;
  font-weight: 700;
  text-decoration: none;
  transition: all 0.2s;
  font-family: inherit;
  border: none;
  cursor: pointer;
}
.cbtn-primary {
  background: linear-gradient(135deg, var(--accent), #f59e0b);
  color: #1a1a1a;
  box-shadow: 0 4px 14px rgba(251,191,36,0.35);
}
.cbtn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(251,191,36,0.45); }
.cbtn-outline {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
}
.cbtn-outline:hover { background: rgba(255,255,255,0.20); }


</body>
</html>
